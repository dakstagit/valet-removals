ne-height:1.55;overflow-wrap:anywhere}.owner .booked-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;background:#f0f8f6;border:1px solid #d5eae3;border-radius:12px}.owner .booked-heading h3{font-size:25px;margin:5px 0}.owner .booked-heading p{margin:0;color:#536b7b}.owner .booked-kicker{font-size:11px;letter-spacing:.12em;color:#007f76;font-weight:800}.owner .booked-total{text-align:right;display:flex;flex-direction:column;gap:6px}.owner .booked-total span{font-size:12px;color:#536b7b}.owner .booked-total strong{font-size:30px;color:#008f88;white-space:nowrap}.owner .rates-heading{display:flex;justify-content:space-between;align-items:start;gap:20px}.owner .rates-heading p{font-size:13px;color:#5f7284;max-width:650px}.owner .rates-group{margin:22px 0 26px;padding:20px;border:1px solid #e2e9ef;border-radius:12px;background:#fff}.owner .rates-group h3{font-size:17px;margin:0 0 18px}.owner .rates-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.owner .rate-field{display:flex;flex-direction:column;gap:8px}.owner .rate-label{font-size:13px;font-weight:700;color:#20344c}.owner .rate-input{display:flex;align-items:center;gap:10px}.owner .rate-input input{width:100%;min-width:0;border:1px solid #ccd9e5;border-radius:8px;padding:12px;font-size:16px}.owner .rate-input em{font-style:normal;font-size:12px;color:#607589;white-space:nowrap}.owner .rate-field small{font-size:12px;color:#6a7c8d;line-height:1.5}.owner .rates-actions{display:flex;align-items:center;gap:16px;position:sticky;bottom:0;background:#f7f9fb;padding:16px 0}@media(max-width:650px){.owner .summary-grid{grid-template-columns:1fr}.owner .booked-heading{align-items:start;flex-direction:column}.owner .booked-total{text-align:left}.owner .rates-heading{flex-direction:column}}</style><link rel="stylesheet" href="/admin/desk-upgrades.css"></head><body><header><div class="wrap nav"><a class="brand" href="/admin" aria-label="Operations home"><span><strong>VALET</strong><small>REMOVALS & TRANSPORT</small></span></a><div class="owner-nav-actions"><span class="eyebrow owner-desk-label">OWNER DESK</span><button type="button" id="ownerSettings" class="button small outline" hidden>Settings</button><button id="logout" class="button small outline" hidden>Log out</button></div></div></header><section id="loginPanel"><h2>Owner login</h2><form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="error" role="alert"></p><button class="button teal" type="submit">Sign in</button></form></section><main id="ownerView" class="wrap owner" ><div class="owner-heading"><div><div class="eyebrow dark">VALET / OWNER DESK</div><h1>Operations dashboard</h1><p class="muted">Manage enquiries, quotations, customers and confirmed removals.</p></div></div><div id="deskDashboard"></div><nav class="desk-tabs" aria-label="Owner Desk views"><button type="button" class="desk-tab active" data-view="pipeline">Pipeline</button><button type="button" class="desk-tab" data-view="board">Kanban board</button><button type="button" class="desk-tab" data-view="calendar">Booking calendar</button><button type="button" class="desk-tab" data-view="customers">Customers</button><button type="button" class="desk-tab" data-view="followups">Follow-ups</button></nav><div id="deskAux"></div><div class="desk-grid" id="deskPipeline"><aside class="queue"><div class="desk-search"><input id="deskSearch" type="search" placeholder="Search name, reference, route…" aria-label="Search enquiries"><select id="deskFilter" aria-label="Filter by status"><option value="">All statuses</option><option value="needs_review">Needs review</option><option value="draft_ready">Draft ready</option><option value="quote_sent">Quote sent</option><option value="change_requested">Changes requested</option><option value="
