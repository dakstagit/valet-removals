<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valet Removals | Owner Desk</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1b2733;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}header{background:#142b3d;color:white;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header h1{font-size:20px;margin:0}main{max-width:1100px;margin:28px auto;padding:0 18px}.panel{background:white;border:1px solid #dce3e8;border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 2px 12px #172d4210}.login{max-width:420px;margin:10vh auto}h2{margin:0 0 16px;font-size:22px}h3{margin:0 0 12px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input,textarea{width:100%;border:1px solid #b9c6d1;border-radius:7px;padding:11px;font:inherit}button{border:0;border-radius:7px;padding:10px 15px;background:#183d58;color:white;font:inherit;font-weight:650;cursor:pointer}button:hover{background:#285778}button.secondary{background:#e8eef2;color:#21394b}button:disabled{opacity:.5;cursor:not-allowed}.error{color:#b11b2b}.muted{color:#64717b;font-size:14px}.layout{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px}.enquiry{display:block;width:100%;text-align:left;background:white;color:#1b2733;border:1px solid #dbe2e8;margin:8px 0;padding:14px}.enquiry.selected{border-color:#183d58;background:#eaf1f6}.enquiry strong{display:block}.enquiry small{display:block;color:#667887;margin-top:5px}.tag{display:inline-block;background:#e8edf3;padding:4px 8px;border-radius:5px;font-size:12px}.kv{display:grid;grid-template-columns:150px 1fr;gap:9px;border-bottom:1px solid #eef1f3;padding:8px 0}.kv span:first-child{color:#697784}.section{margin-top:25px;border-top:1px solid #e2e7ea;padding-top:18px}.quote{padding:12px;border:1px solid #e0e7eb;border-radius:8px;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f9;padding:12px;border-radius:7px;font-size:12px}#logout{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}header{padding:18px}}
</style></head><body>
<header><h1>Valet Removals · Owner Desk</h1><button id="logout" class="secondary">Log out</button></header>
<main><section id="loginPanel" class="panel login"><h2>Owner login</h2><form id="loginForm"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p id="loginError" class="error" role="alert"></p><button type="submit">Sign in</button></form></section>
<section id="desk" hidden><div class="panel"><h2>Enquiries</h2><p class="muted">New website enquiries appear here once the enquiry form is connected to the API.</p><button id="refresh" class="secondary">Refresh enquiries</button><span id="status" class="muted" role="status"></span></div><div class="layout"><div class="panel"><h3>Enquiry list</h3><div id="list"></div></div><div class="panel"><h3>Enquiry details</h3><div id="detail" class="muted">Select an enquiry to view its details.</div></div></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let enquiries=[],selected=null;
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed ('+r.status+')');return data}
function showDesk(){ $('loginPanel').hidden=true;$('desk').hidden=false;$('logout').style.display='inline-block'}
function showLogin(){ $('desk').hidden=true;$('loginPanel').hidden=false;$('logout').style.display='none'}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const button=e.target.querySelector('button');button.disabled=true;try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});$('password').value='';showDesk();await load()}catch(err){$('loginError').textContent=err.message}finally{button.disabled=false}});
$('logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}catch{}showLogin();$('detail').textContent='Select an enquiry to view its details.'};
$('refresh').onclick=load;
async function load(){ $('status').textContent=' Loading…';try{enquiries=await api('/api/admin/enquiries');$('list').innerHTML=enquiries.length?enquiries.map(e=>'<button class="enquiry '+(selected===e.id?'selected':'')+'" data-id="'+e.id+'"><strong>'+esc(e.reference||'#'+e.id)+'</strong>'+esc(e.job?.name||'Unknown customer')+'<small>'+esc(e.job?.from||'')+' → '+esc(e.job?.to||'')+'</small><small>'+esc(e.status)+' · '+new Date(e.created_at).toLocaleString()+'</small></button>').join(''):'<p class="muted">No enquiries yet.</p>';$('list').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>openEnquiry(Number(b.dataset.id)));$('status').textContent=' '+enquiries.length+' enquiries';if(selected&&enquiries.some(e=>e.id===selected))await openEnquiry(selected)}catch(err){$('status').textContent=' '+err.message;if(/Authentication|Session/.test(err.message))showLogin()}}
async function openEnquiry(id){selected=id;document.querySelectorAll('.enquiry').forEach(b=>b.classList.toggle('selected',Number(b.dataset.id)===id));$('detail').textContent='Loading…';try{const e=await api('/api/admin/enquiries/'+id);const fields=[['Reference',e.reference],['Status',e.status],['Customer',e.job?.name],['Email',e.job?.email],['Phone',e.job?.phone],['From',e.job?.from],['To',e.job?.to],['Move date',e.job?.date],['Received',new Date(e.created_at).toLocaleString()]];$('detail').innerHTML=fields.map(([k,v])=>'<div class="kv"><span>'+esc(k)+'</span><span>'+esc(v||'—')+'</span></div>').join('')+'<div class="section"><h3>Full enquiry</h3><pre>'+esc(JSON.stringify(e.job,null,2))+'</pre></div><div class="section"><h3>Quote history</h3>'+(e.quotes?.length?e.quotes.map(q=>'<div class="quote"><strong>Revision '+esc(q.revision)+'</strong> <span class="tag">'+esc(q.state)+'</span><pre>'+esc(JSON.stringify(q.quote,null,2))+'</pre></div>').join(''):'<p class="muted">No quotes prepared.</p>')+'</div><div class="section"><h3>Messages</h3>'+(e.messages?.length?e.messages.map(m=>'<div class="quote"><strong>'+esc(m.sender)+'</strong> · '+esc(m.kind)+'<p>'+esc(m.body)+'</p></div>').join(''):'<p class="muted">No messages.</p>')+'</div>'}catch(err){$('detail').textContent=err.message}}
api('/api/admin/me').then(()=>{showDesk();load()}).catch(showLogin);
</script></body></html>
