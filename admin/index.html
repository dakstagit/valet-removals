<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valet | Owner Desk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/journey.css"><style>body{background:#f7f9fb}#loginPanel{max-width:440px;margin:80px auto;padding:32px;background:white;border:1px solid #dce4eb;border-radius:14px}#loginPanel input{display:block;width:100%;padding:12px;margin:7px 0 16px;border:1px solid #c7d3dc;border-radius:8px}.owner{min-height:75vh}.owner .queue-item{width:100%;text-align:left}.owner .quote-detail{min-width:0}.owner .detail-body{padding:25px}.owner .field input,.owner .field textarea{width:100%}.owner .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.owner .settings-panel{padding:20px}.owner .field{display:block;margin:12px 0}.owner .field-label{display:block;margin-bottom:6px}.owner .error{color:#b21d32}.owner .action-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px}.owner pre{white-space:pre-wrap;overflow-wrap:anywhere}.owner .review-flags{padding:15px;background:#fff4e9;border-radius:8px}.owner .quote-line{padding:7px 0;border-bottom:1px solid #e4e9ef}.owner .detail-top{padding:20px}.owner .detail-top p{overflow-wrap:anywhere}</style></head><body><header><div class="wrap nav"><a class="brand" href="/" aria-label="Valet home"><span><strong>VALET</strong><small>REMOVALS & TRANSPORT</small></span></a><span class="eyebrow">OWNER DESK</span><button id="logout" class="button small outline" hidden>Log out</button></div></header><section id="loginPanel"><h2>Owner login</h2><form id="loginForm"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="error" role="alert"></p><button class="button teal" type="submit">Sign in</button></form></section><main id="ownerView" class="wrap owner" ><div class="owner-heading"><div><div class="eyebrow dark">VALET / OWNER DESK</div><h1>Your quote, explained.</h1><p class="muted">Review enquiries, calculate quotes and manage your rates.</p></div><button class="button outline" id="settingsBtn">Edit rate settings</button></div><section id="settingsPanel" class="settings-panel" hidden></section><div class="desk-grid"><aside class="queue"><div class="queue-heading"><h2>Enquiries</h2><span id="queueLabel">0 enquiries</span></div><div id="queueList"></div></aside><section id="quoteDetail" class="quote-detail"><div class="empty"><h2>Select an enquiry</h2><p>Choose a customer enquiry from the list to review its pricing and prepare a draft.</p></div></section></div></main><div id="toast" role="status" class="toast" hidden></div><script type="module" src="/admin/owner-v2.js"></script></body></html>
