<main id="customerView">
<section class="hero"><div class="wrap hero-grid"><div class="hero-copy"><div class="eyebrow"><span></span> COLLECTIONS · DELIVERIES · SMALL MOVES</div><h1>Your move.<br><em>Less hassle.</em></h1><p>From a marketplace find to a fresh start. Tell us what needs moving, and we’ll prepare a quote for the help you need.</p><div class="hero-points"><span>✓ Ready-to-collect options</span><span>✓ Indoor help available</span><span>✓ Price agreed before booking</span></div><div class="van-scene"><img src="valet-van.png" alt="Valet branded van and collection boxes outside a home"><div class="photo-caption"><span class="route-dot"></span> From your door. To your next destination.</div></div><div class="hero-foot"><strong>A little detail. A clearer quote.</strong><span>No long inventory lists. Just the essentials.</span></div></div>
<div class="quote-card" id="quote"><div class="quote-top"><span class="eyebrow dark">LET’S GET YOU MOVING</span><span class="pill">No obligation</span></div><div id="wizard"><h2>Tell us about your move.</h2><p class="muted lead-small">A few details now. A personalised quote next.</p><ol class="stepper" aria-label="Quote steps"><li class="active" data-step="0"><span>1</span>Journey</li><li data-step="1"><span>2</span>Items</li><li data-step="2"><span>3</span>Access & details</li></ol><form id="quoteForm" novalidate><div id="formStep"></div><p id="formError" class="form-error" role="alert" hidden></p><div class="form-actions"><button id="backBtn" class="textbutton" type="button" hidden>← Back</button><button id="nextBtn" type="submit" class="button orange">Continue <span>→</span></button></div><p class="form-footnote">Your details help us plan the right vehicle, team and time.</p></form></div><div id="success" hidden></div></div></div></section>
<section class="service-section wrap" id="services"><div class="section-head"><div><div class="eyebrow dark">THE HELP YOU NEED</div><h2>Choose how we collect.<br>Choose how we deliver.</h2></div><p>Mix and match at each address.<br>Simple access means less handling time.</p></div><div class="service-grid"><article><div class="service-icon">↗</div><div><span class="eyebrow dark">PACKED. READY. ON THE WAY.</span><h3>Ready to collect</h3><p>Items ready at an accessible ground-floor entrance. We load, secure, transport and unload.</p><div class="service-rule">Level access · No steps · Vehicle within 10 metres</div></div></article><article><div class="service-icon orange-icon">⌂</div><div><span class="eyebrow dark">A LITTLE EXTRA HELP</span><h3>Indoor collection & delivery</h3><p>Need us to carry items from a room or upstairs? Tell us about the access so we can plan the right team.</p><div class="service-rule">Room collection · Stairs or lifts · Agreed dismantling</div></div></article></div><p class="caption">“Doorstep” means the building’s ground-floor entrance, not an upstairs apartment door. Keep items dry and secure until collection.</p></section>
<section class="how wrap" id="how-it-works"><div><div class="eyebrow dark">A SIMPLE WAY TO MOVE</div><h2>From details<br>to delivery.</h2></div><ol><li><b>01</b><h3>Tell us the essentials</h3><p>Where, what and when. Add photos if you have them.</p></li><li><b>02</b><h3>Agree your quote</h3><p>We review the route and access, then confirm the price and scope.</p></li><li><b>03</b><h3>Get ready to go</h3><p>Prepare your items and leave the agreed collection and delivery to us.</p></li></ol></section>
<section class="faq wrap" id="questions"><div><div class="eyebrow dark">GOOD TO KNOW</div><h2>A few moving questions.</h2></div><div><details><summary>Do I need to leave everything outside?</summary><p>No. Keep items dry and secure until the team arrives. For ready-to-collect service, have them packed and ready at an accessible ground-floor entrance. Choose indoor help if items need carrying from rooms or upstairs.</p></details><details><summary>Why do you ask about stairs and parking?</summary><p>They affect how long the work takes and the team needed. Checking both addresses helps us agree a realistic price before you book.</p></details><details><summary>Can you collect something I bought online?</summary><p>Yes—use the collection and delivery option and add a listing link or photos. Please check the seller’s access and collection arrangements too. If you do not know, select “Not sure”.</p></details><details><summary>What if my items are unusually heavy?</summary><p>Tell us about the item and include dimensions or weight if known. We review specialist equipment, narrow access and unusually heavy items before accepting the job.</p></details><details><summary>Will I get an instant price?</summary><p>This model uses a reviewed quote. We check the details and agree the price before booking. Extra items or changed requirements are agreed before additional work starts.</p></details></div></section>
</main>
<main id="ownerView" class="wrap owner" hidden><div class="owner-heading"><div><div class="eyebrow dark">VALET / OWNER DESK</div><h1>Your quote, explained.</h1><p class="muted">Test the form, review the workload and adjust the assumptions.</p></div><button class="button outline" id="settingsBtn">Edit rate settings</button></div><div class="demo-notice"><strong>Prototype only.</strong> Messages, quotes and customer responses are simulated in this browser tab. No real email, WhatsApp message, payment or booking is sent. Rates are illustrative; review them before launch.</div><div class="samples"><span>TRY A SCENARIO</span><button data-sample="simple">Easy collection ↗</button><button data-sample="stairs">Apartment move ↗</button><button data-sample="special">Heavy item ↗</button><button id="changeJourneyBtn">Change request ↗</button><button id="blankForm" class="textbutton">Start a blank enquiry</button></div><section id="settingsPanel" class="settings-panel" hidden></section><div class="desk-grid"><aside class="queue"><div class="queue-heading"><h2>Enquiries</h2><span id="queueLabel">0 in this tab</span></div><div id="queueList"></div></aside><section id="quoteDetail" class="quote-detail"><div class="empty"><span class="empty-icon">↗</span><h2>Let’s put a quote through its paces.</h2><p>Choose a sample above or complete the customer form. You’ll see every time allowance and review flag here. Use “Try full journey” to jump straight to the customer’s email and WhatsApp screens.</p><button class="button teal" data-sample="simple">Load an easy collection</button></div></section></div></main>
